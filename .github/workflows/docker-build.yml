name: Build and Publish Chatwoot Docker Image

on:
  push:
    branches:
      - woodesk-dev
    paths:
      - '**/Dockerfile'
      - '**/docker-compose.*.yaml'
      - 'Gemfile.lock'
      - 'package.json'
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatwoot:latest,ghcr.io/${{ github.repository_owner }}/chatwoot:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/chatwoot:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/chatwoot:buildcache,mode=max

      - name: Image digests
        run: echo "Image built and pushed"
